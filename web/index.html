<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>都市の鼓動 | City Pulse</title>
<meta name="description" content="公共交通の時刻表(GTFS)から、街の24時間の“鼓動”を3Dで鑑賞するビジュアライザー。GTFSをドロップすれば、どの街でも同じ体験をつくれます。" />
<meta name="theme-color" content="#03040a" />
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="都市の鼓動 (CITY PULSE)" />
<meta property="og:title" content="都市の鼓動 — CITY PULSE" />
<meta property="og:description" content="公共交通の時刻表(GTFS)から、街の24時間の“鼓動”を3Dで鑑賞するビジュアライザー。GTFSをドロップすれば、どの街でも。" />
<meta property="og:url" content="https://city-pulse-v0lm.onrender.com/" />
<meta property="og:image" content="https://city-pulse-v0lm.onrender.com/static/ogp.png" />
<meta property="og:image:width" content="1200" />

<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.31/dist.min.js"></script>
<link href="/static/home.css" rel="stylesheet" />
<script src="/static/citystore.js"></script>
<script src="/static/mvt.js"></script>
<script src="/static/buildings.js"></script>
<script src="/static/home.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#03040a; --ink:#f1f5f9; --ink2:#cbd5e1; --mute:#8b98ad; --dim:#56627a;
    --rail:#5eead4; --bus:#fb923c; --line:rgba(255,255,255,0.08); --glass:rgba(6,10,22,0.55);
    --serif:'Shippori Mincho B1','Noto Serif JP',serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; width:100%; background:var(--bg); overflow:hidden;
    font-family:'Inter','Noto Sans JP',-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
  #map { position:absolute; inset:0; }

  #skyFx { position:absolute; inset:0; z-index:2; pointer-events:none; mix-blend-mode:soft-light; transition: background 1.2s ease; }
  #weatherFx { position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0; transition:opacity 1s ease; }
  #weatherFx.heat { opacity:1; background:radial-gradient(circle at 50% 25%, rgba(234,88,12,0.20), rgba(3,4,10,0.10) 70%); }
  /* 周辺減光 + 上下の帯(HUDの読みやすさ) + ごく薄い粒子 */
  #vignette { position:absolute; inset:0; z-index:4; pointer-events:none;
    box-shadow: inset 0 0 18vw 2vw rgba(0,0,0,0.55);
    background: linear-gradient(to bottom, rgba(3,4,10,0.5) 0%, rgba(3,4,10,0) 20%, rgba(3,4,10,0) 70%, rgba(3,4,10,0.62) 100%); }
  #vignette::after { content:''; position:absolute; inset:0; opacity:0.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* 読み込み中: 心電図の光が走る */
  #loading { position:absolute; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; color:var(--mute); transition:opacity 0.9s ease;
    background: radial-gradient(700px 420px at 50% 42%, rgba(94,234,212,0.08), transparent 65%), var(--bg); }
  #loading .ekg { width:min(300px, 70vw); height:64px; overflow:visible; margin-bottom:10px; }
  #loading .ekg path { fill:none; stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke; }
  #loading .ekg .base { stroke:rgba(94,234,212,0.16); stroke-width:1; }
  #loading .ekg .trace { stroke:url(#loadEkgGrad); stroke-width:2.2; stroke-dasharray:24 76; animation:ekgTrace 1.8s linear infinite;
    filter:drop-shadow(0 0 6px rgba(94,234,212,0.8)); }
  @keyframes ekgTrace { from { stroke-dashoffset:100; } to { stroke-dashoffset:0; } }
  #loading .lt { font-family:var(--serif); font-size:2rem; font-weight:800; color:var(--ink); letter-spacing:0.2em; padding-left:0.2em; }
  #loading .le { font-family:var(--mono); font-size:0.62rem; letter-spacing:0.5em; padding-left:0.5em; color:var(--rail); opacity:0.8; }
  #loading .lg { margin-top:18px; max-width:560px; padding:0 20px; text-align:center; font-size:0.8rem; line-height:1.7; color:var(--mute); letter-spacing:0.08em; }
  #loading.hidden { opacity:0; pointer-events:none; }

  /* タイトル */
  #topHud { position:absolute; top:24px; left:28px; right:28px; z-index:6; display:flex;
    justify-content:space-between; align-items:flex-start; pointer-events:none; }
  #titleBlock { color:var(--ink); text-shadow: 0 2px 22px rgba(0,0,0,0.75); display:flex; flex-direction:column; align-items:center; }
  /* --p: 鼓動の強さ(0〜1.x、運行数に応じた心拍でJSが毎フレーム更新) / --tod: 時間帯の色(r,g,b) */
  #topHud, #statsHud, #pulseWrap { --p:0; --tod:190,225,255; }
  #titleBlock .t { font-family:var(--serif); font-size:1.65rem; font-weight:800; line-height:1.15; letter-spacing:0.18em; padding-left:0.18em;
    text-shadow:0 2px 22px rgba(0,0,0,0.75), 0 0 calc(6px + var(--p) * 22px) rgba(var(--tod), calc(0.08 + var(--p) * 0.5)); }
  #titleBlock .s { display:flex; align-items:center; gap:8px; margin-top:7px; font-family:var(--mono); font-size:0.56rem;
    letter-spacing:0.46em; color:var(--rail); opacity:0.9; }
  #titleBlock .s::before, #titleBlock .s::after { content:''; width:16px; height:1px; }
  #titleBlock .s::before { background:linear-gradient(90deg, transparent, rgba(94,234,212,0.8)); margin-right:0.46em; }
  #titleBlock .s::after { background:linear-gradient(90deg, rgba(251,146,60,0.8), transparent); }
  #titleBlock .sub2 { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:0.66rem; }
  #titleBlock .c { color:var(--ink2); font-weight:500; letter-spacing:0.08em; }
  #titleBlock .c:empty { display:none; }
  #titleBlock .h { color:var(--ink2); text-decoration:none; pointer-events:auto; letter-spacing:0.06em; text-shadow:none;
    padding:4px 12px 4px 10px; border-radius:999px; background:var(--glass); border:1px solid var(--line);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:color .2s, border-color .2s, background .2s; }
  #titleBlock .h:hover { color:var(--rail); border-color:rgba(94,234,212,0.45); background:rgba(94,234,212,0.1); }

  /* 時計と稼働数 */
  #statsHud { position:absolute; top:20px; left:50%; transform:translateX(-50%); z-index:6; text-align:center;
    pointer-events:none; color:#fff; }
  #clockDisplay { font-family:'Inter',sans-serif; font-size:3.4rem; font-weight:200; letter-spacing:0.02em; line-height:1;
    font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1;
    text-shadow:0 0 30px rgba(var(--tod),0.28), 0 2px 26px rgba(0,0,0,0.8); }
  #clockDisplay.chime { animation:chime 1.4s ease-out; }
  @keyframes chime {
    0% { text-shadow:0 0 18px rgba(var(--tod),0.95), 0 0 46px rgba(var(--tod),0.7), 0 2px 26px rgba(0,0,0,0.8); }
    100% { text-shadow:0 0 30px rgba(var(--tod),0.28), 0 2px 26px rgba(0,0,0,0.8); }
  }
  #todLabel { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:8px; height:0.9rem;
    font-size:0.62rem; letter-spacing:0.16em; color:rgb(var(--tod)); text-shadow:0 1px 12px rgba(0,0,0,0.9); }
  #todLabel .en { font-family:var(--mono); font-size:0.56rem; letter-spacing:0.34em; opacity:0.85; }
  #todLabel .en::after { content:''; display:inline-block; width:14px; height:1px; margin:0 0 3px 10px; background:rgba(var(--tod),0.5); }
  #statLine { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px;
    font-size:0.72rem; color:var(--ink2); letter-spacing:0.06em; white-space:nowrap; }
  #statLine .live { display:inline-flex; align-items:center; gap:7px; margin-right:2px; font-size:0.64rem; letter-spacing:0.16em;
    color:var(--ink2); text-shadow:0 1px 12px rgba(0,0,0,0.9); }
  #statLine .live::before { content:''; width:6px; height:6px; border-radius:50%; background:rgb(var(--tod));
    transform:scale(calc(1 + var(--p) * 0.55));
    box-shadow:0 0 calc(2px + var(--p) * 12px) rgba(var(--tod), calc(0.35 + var(--p) * 0.55)); }
  #statLine .chip { display:inline-flex; align-items:baseline; gap:6px; padding:5px 13px 5px 11px; border-radius:999px;
    background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  #statLine .chip i { align-self:center; width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 10px currentColor; }
  #statLine .chip b { font-size:0.98rem; font-weight:600; font-variant-numeric:tabular-nums; min-width:2.2ch; text-align:right; letter-spacing:0.02em; }
  #statLine .chip small { font-size:0.62rem; opacity:0.7; }
  #statLine .rail-label { color:var(--rail); border-color:rgba(94,234,212,0.22); }
  #statLine .bus-label { color:var(--bus); border-color:rgba(251,146,60,0.22); }

  /* 鼓動チャート */
  #pulseWrap { position:absolute; left:0; right:0; bottom:0; z-index:6; padding:10px 28px 16px; pointer-events:auto; }
  #pulseLabels { display:flex; justify-content:space-between; font-family:var(--mono); font-size:0.58rem; color:var(--mute);
    letter-spacing:0.08em; margin-bottom:6px; padding:0 2px; text-shadow:0 1px 10px rgba(0,0,0,0.9); }
  #pulseChart { position:relative; height:80px; border-radius:14px; cursor:pointer; overflow:hidden;
    background:
      linear-gradient(to right, rgba(255,255,255,0.075) 1px, transparent 1px) 0 0 / 25% 100%,
      linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px) 0 0 / calc(100% / 24) 100%,
      linear-gradient(180deg, rgba(12,18,36,0.6), rgba(3,6,16,0.72));
    border:1px solid rgba(255,255,255,0.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 16px 44px -12px rgba(0,0,0,0.7);
    backdrop-filter:blur(10px) saturate(1.2); -webkit-backdrop-filter:blur(10px) saturate(1.2); }
  #pulseSvg { width:100%; height:100%; display:block; }
  #pulsePlayhead { position:absolute; top:0; bottom:0; width:1.5px; pointer-events:none; transform:translateX(-0.75px);
    background:linear-gradient(to bottom, #fff, rgba(var(--tod),0.4)); box-shadow:0 0 12px 1px rgba(var(--tod),0.6); }
  #pulsePlayhead::before { content:''; position:absolute; top:6px; left:50%; width:7px; height:7px; margin-left:-3.5px; border-radius:50%;
    background:#fff; transform:scale(calc(1 + var(--p) * 0.45));
    box-shadow:0 0 0 3px rgba(var(--tod),0.18), 0 0 calc(10px + var(--p) * 14px) 2px rgba(var(--tod),0.8); }
  /* 再生位置より右(これからの時間帯)を少し沈める */
  #pulsePlayhead::after { content:''; position:absolute; top:0; bottom:0; left:1.5px; width:200vw;
    background:linear-gradient(90deg, rgba(3,6,16,0.12), rgba(3,6,16,0.46) 48px); }
  #pulseHint { text-align:center; font-size:0.62rem; color:var(--dim); margin-top:8px; letter-spacing:0.06em; }
  #pulseHint .hint-touch { display:none; }
  #pulseChart { touch-action:none; }

  @media (hover: none) {
    #pulseHint .hint-pc { display:none; }
    #pulseHint .hint-touch { display:inline; }
  }

  /* MapLibreの操作ボタン・出典をダークガラスに */
  .maplibregl-ctrl-top-right { top:14px; right:14px; }
  .maplibregl-ctrl-group:not(:empty) { background:rgba(6,10,22,0.6); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    box-shadow:0 10px 30px -8px rgba(0,0,0,0.6); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .maplibregl-ctrl-group button { width:32px; height:32px; }
  .maplibregl-ctrl-group button + button { border-top:1px solid rgba(255,255,255,0.07); }
  .maplibregl-ctrl-group button:not(:disabled):hover { background-color:rgba(94,234,212,0.12); }
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter:invert(1) brightness(0.85); }
  .maplibregl-ctrl.maplibregl-ctrl-attrib { background:rgba(3,4,10,0.55); color:var(--dim); font-size:10px; border-radius:8px 0 0 0; }
  .maplibregl-ctrl-attrib a { color:var(--mute); }
  .maplibregl-ctrl.maplibregl-ctrl-attrib.maplibregl-compact { background:rgba(6,10,22,0.7); border:1px solid var(--line); border-radius:12px; }
  .maplibregl-ctrl-attrib-button { filter:invert(1) brightness(0.8); }

  /* 読み込み完了後、HUDをふわっと出す(:has 非対応ブラウザではそのまま表示) */
  #map:has(#loading.hidden) #topHud { animation:hudIn 1s cubic-bezier(.2,.7,.2,1) backwards 0.1s; }
  #map:has(#loading.hidden) #statsHud { animation:hudInC 1s cubic-bezier(.2,.7,.2,1) backwards 0.2s; }
  #map:has(#loading.hidden) #pulseWrap { animation:hudUp 1s cubic-bezier(.2,.7,.2,1) backwards 0.3s; }
  @keyframes hudIn { from { opacity:0; transform:translateY(-8px); } }
  @keyframes hudInC { from { opacity:0; transform:translate(-50%, -8px); } }
  @keyframes hudUp { from { opacity:0; transform:translateY(12px); } }
  @media (prefers-reduced-motion: reduce) {
    #loading .ekg .trace, #statLine .live::before { animation:none; }
    #map:has(#loading.hidden) #topHud, #map:has(#loading.hidden) #statsHud, #map:has(#loading.hidden) #pulseWrap { animation:none; }
  }

  /* スマホ・狭い画面: タイトル・時計・稼働数が重ならないよう縦に積む */
  @media (max-width: 640px) {
    #topHud { top:14px; left:14px; right:60px; }
    #titleBlock { align-items:flex-start; }
    #titleBlock .t { font-size:1.2rem; letter-spacing:0.14em; padding-left:0; }
    #titleBlock .s { font-size:0.5rem; margin-top:5px; }
    #titleBlock .s::before { display:none; }

    #statsHud { top:78px; width:calc(100% - 28px); max-width:380px; }
    #titleBlock .sub2 { font-size:0.6rem; margin-top:7px; }
    #clockDisplay { font-size:2.5rem; }
    #todLabel { margin-top:5px; }
    #statLine { gap:6px; font-size:0.66rem; margin-top:8px; letter-spacing:0.02em; }
    #statLine .live { font-size:0.58rem; letter-spacing:0.08em; }
    #statLine .chip { padding:4px 10px 4px 9px; gap:5px; }
    #statLine .chip b { font-size:0.86rem; }

    #pulseWrap { padding:8px 12px calc(12px + env(safe-area-inset-bottom)); }
    #pulseLabels { font-size:0.52rem; margin-bottom:4px; }
    #pulseChart { height:64px; border-radius:12px; }
    #pulseHint { font-size:0.56rem; margin-top:5px; letter-spacing:0; }

    #loading .lt { font-size:1.5rem; }
    #loading .lg { font-size:0.74rem; }

    .maplibregl-ctrl-top-right { top:6px; right:6px; }
    .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { bottom:calc(122px + env(safe-area-inset-bottom)); }
  }
  @media (max-width: 360px) {
    #statLine .live { display:none; }
  }

  ::selection { background: rgba(94,234,212,0.35); }
</style>
</head>
<body>
<script>document.body.classList.add(new URLSearchParams(location.search).get('city') ? 'viewer' : 'home');</script>
<div id="home"></div>
<div id="map">
  <div id="skyFx"></div>
  <div id="weatherFx"></div>
  <div id="vignette"></div>

  <div id="topHud">
    <div id="titleBlock">
      <div class="t">都市の鼓動</div>
      <div class="s">CITY PULSE</div>
      <div class="sub2"><span class="c" id="cityLabel"></span><a class="h" href="./">‹ ホーム</a></div>
    </div>
  </div>

  <div id="statsHud">
    <div id="clockDisplay">00:00</div>
    <div id="todLabel"></div>
    <div id="statLine"><span class="live">現在稼働中</span><span class="chip rail-label"><i></i>鉄道<b id="railCount">--</b><small>台</small></span><span class="chip bus-label"><i></i>バス<b id="busCount">--</b><small>台</small></span></div>
  </div>

  <div id="pulseWrap">
    <div id="pulseLabels"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
    <div id="pulseChart">
      <svg id="pulseSvg" viewBox="0 0 1000 100" preserveAspectRatio="none"></svg>
      <div id="pulsePlayhead"></div>
    </div>
    <div id="pulseHint">
      <span class="hint-pc">クリック/ドラッグで時間帯を移動 ・ マウスドラッグで視点回転 ・ 何もしなければ自動再生</span>
      <span class="hint-touch">グラフをなぞって時間帯を移動 ・ 2本指で視点回転 ・ 放置で自動再生</span>
    </div>
  </div>

  <div id="loading">
    <svg class="ekg" viewBox="0 0 300 64" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="loadEkgGrad" x1="0" x2="300" y1="0" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs>
      <path class="base" pathLength="100" d="M0 34 H118 L128 34 L136 16 L148 56 L160 6 L172 46 L180 34 H300"/>
      <path class="trace" pathLength="100" d="M0 34 H118 L128 34 L136 16 L148 56 L160 6 L172 46 L180 34 H300"/>
    </svg>
    <div class="lt">都市の鼓動</div>
    <div class="le">CITY PULSE</div>
    <div class="lg">街の鼓動を読み込んでいます…</div>
  </div>
</div>

<script>
/* ============================================================== *
 * 都市の鼓動 (City Pulse) — 24時間ビジュアライザー
 * 特定のタスクを持たない鑑賞用アート作品。実際のGTFS時刻表・建物形状・
 * 気象データをもとに、街の一日の呼吸(通勤ラッシュ=鼓動が高まる、深夜=
 * 静まる)を光の軌跡として可視化する。
 * ============================================================== */

const CENTER = [139.7622, 35.6866];
const LOOP_SEC = 300;                 // 24時間を実時間5分でループ再生
const SIM_SPEED = 86400 / LOOP_SEC;   // 1秒あたりの進行(シミュレーション秒)
const AUTO_ROTATE_DEG_PER_SEC = 1.0;
const IDLE_BEFORE_AUTOROTATE_MS = 3500;

let map, deckOverlay;
let buildings = [];
let pulseData = { duration_sec: 86400, bucket_sec: 300, max_activity: 1, activity: [], trips: [] };
let simTime = 0;
let deadZones = []; // 鉄道・バスとも稼働0台の時間帯([開始秒, 終了秒) のリスト)。自動再生ではスキップする。
let lastFrameTs = null;
let lastUserActionTs = 0;
let weather = { precipitation: { intensity: 0, risk_level: 'low' }, wbgt: { intensity: 0, risk_level: 'low' } };

/* ---------------------------------------------------------------- *
 * 建物と車両の近接判定(鉄道・バスが通り過ぎた建物が光る演出)用インデックス
 * ---------------------------------------------------------------- */
const GRID_CELL_DEG = 0.002;       // 空間インデックスのマス目(約220m四方)
const TOUCH_MARGIN_DEG = 0.0018;   // 建物の輪郭からこの距離内なら周辺として光る対象(約200m)
const HEAT_HALFLIFE_MS = 2500;     // 蓄積した「熱」が半減するまでの時間(実時間ミリ秒)
const HEAT_ADD_PER_SEC = 3.2;      // 車両が触れている間、1秒あたり蓄積する熱量
const GLOW_MAX_INTENSITY = 0.85;   // 熱が最大(=拠点)のときの光の強さ
const GLOW_RAIL = [190, 255, 235];
const GLOW_BUS = [255, 205, 140];
let buildingCx = new Float64Array(0);
let buildingCy = new Float64Array(0);
let buildingRadius = new Float32Array(0);
let buildingHeatRail = new Float32Array(0);
let buildingHeatBus = new Float32Array(0);
let buildingHeatAtRail = new Float32Array(0);
let buildingHeatAtBus = new Float32Array(0);
let buildingGrid = new Map();
let lastGlowFrameAt = 0;

function decayedHeat(heat, at, now) {
  if (!at) return 0;
  const dt = now - at;
  if (dt <= 0) return heat;
  return heat * Math.pow(0.5, dt / HEAT_HALFLIFE_MS);
}
// deck.glはgetFillColorに新しい関数を渡すだけでは属性を再計算しないため、
// updateTriggersで明示的に「今フレーム再計算が必要」と伝える。
// 57,198棟すべてを毎フレーム再計算すると重いので、一定間隔に間引く。
let colorTick = 0;
let lastColorTickAt = 0;
const COLOR_TICK_INTERVAL_MS = 120;

function buildBuildingIndex() {
  const n = buildings.length;
  buildingCx = new Float64Array(n);
  buildingCy = new Float64Array(n);
  buildingRadius = new Float32Array(n);
  buildingHeatRail = new Float32Array(n);
  buildingHeatBus = new Float32Array(n);
  buildingHeatAtRail = new Float32Array(n);
  buildingHeatAtBus = new Float32Array(n);
  buildingGrid = new Map();

  for (let i = 0; i < n; i++) {
    const poly = buildings[i].polygon;
    let sx = 0, sy = 0;
    for (const [lon, lat] of poly) { sx += lon; sy += lat; }
    const cx = sx / poly.length, cy = sy / poly.length;
    let maxR = 0;
    for (const [lon, lat] of poly) {
      const d = Math.hypot(lon - cx, lat - cy);
      if (d > maxR) maxR = d;
    }
    buildingCx[i] = cx; buildingCy[i] = cy; buildingRadius[i] = maxR;
    const key = Math.floor(cx / GRID_CELL_DEG) + '_' + Math.floor(cy / GRID_CELL_DEG);
    let bucket = buildingGrid.get(key);
    if (!bucket) { bucket = []; buildingGrid.set(key, bucket); }
    bucket.push(i);
  }
}

function updateBuildingGlow(vehicles) {
  if (!buildings.length) return;
  const now = performance.now();
  // 経過時間に応じた熱量加算にすることで、フレームレートに依存せず
  // 「同時に多くの便が触れている拠点ほど熱が積み上がって明るくなる」を再現する。
  const dtSec = Math.min(now - (lastGlowFrameAt || now), 200) / 1000;
  lastGlowFrameAt = now;

  for (const v of vehicles) {
    const [lon, lat] = v.position;
    const isRail = v.mode === 'rail';
    const heatArr = isRail ? buildingHeatRail : buildingHeatBus;
    const atArr = isRail ? buildingHeatAtRail : buildingHeatAtBus;
    const gx = Math.floor(lon / GRID_CELL_DEG), gy = Math.floor(lat / GRID_CELL_DEG);
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const bucket = buildingGrid.get((gx + dx) + '_' + (gy + dy));
        if (!bucket) continue;
        for (const i of bucket) {
          const dist = Math.hypot(lon - buildingCx[i], lat - buildingCy[i]);
          const reach = buildingRadius[i] + TOUCH_MARGIN_DEG;
          if (dist < reach) {
            // 直接触れているほど濃く、周辺(輪郭から離れるほど)淡く寄与する
            const prox = 1 - Math.max(0, dist - buildingRadius[i]) / TOUCH_MARGIN_DEG;
            const cur = decayedHeat(heatArr[i], atArr[i], now);
            heatArr[i] = Math.min(1, cur + prox * HEAT_ADD_PER_SEC * dtSec);
            atArr[i] = now;
          }
        }
      }
    }
  }
}

function computeDeadZones() {
  deadZones = [];
  const activity = pulseData.activity;
  const bucketSec = pulseData.bucket_sec;
  let start = null;
  for (const b of activity) {
    const isDead = (b.rail || 0) + (b.bus || 0) === 0;
    if (isDead && start === null) start = b.t;
    if (!isDead && start !== null) { deadZones.push([start, b.t]); start = null; }
  }
  if (start !== null) deadZones.push([start, pulseData.duration_sec]);
}

// 0台の時間帯に入っていたら、その終わりまで進める(自動再生・初期表示・チャート操作の全経路で共通)
function skipDeadZones(t) {
  t = ((t % pulseData.duration_sec) + pulseData.duration_sec) % pulseData.duration_sec;
  for (const [s, e] of deadZones) {
    if (t >= s && t < e) return e % pulseData.duration_sec;
  }
  return t;
}

function fmtClock(totalSec) {
  totalSec = ((totalSec % 86400) + 86400) % 86400;
  const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
  const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
  return `${h}:${m}`;
}

/* ---------------------------------------------------------------- *
 * 時刻に応じた空・霧・建物トーンのグラデーション(黎明・昼・夕暮れ・夜)
 * ---------------------------------------------------------------- */
const SKY_STOPS = [
  { h: 0,    sky: [4, 6, 16],    build: [16, 20, 34] },
  { h: 4.5,  sky: [6, 9, 26],    build: [18, 22, 40] },
  { h: 5.8,  sky: [255, 140, 92], build: [70, 46, 44] },
  { h: 7.5,  sky: [150, 205, 255], build: [58, 68, 92] },
  { h: 12,   sky: [110, 185, 255], build: [55, 66, 92] },
  { h: 16.5, sky: [255, 170, 110], build: [78, 58, 48] },
  { h: 18.5, sky: [255, 120, 90],  build: [70, 42, 52] },
  { h: 20,   sky: [40, 28, 62],   build: [34, 26, 50] },
  { h: 22,   sky: [10, 11, 28],   build: [20, 22, 38] },
  { h: 24,   sky: [4, 6, 16],    build: [16, 20, 34] },
];

function lerp(a, b, t) { return a + (b - a) * t; }
function lerpRGB(a, b, t) { return [Math.round(lerp(a[0],b[0],t)), Math.round(lerp(a[1],b[1],t)), Math.round(lerp(a[2],b[2],t))]; }

function skyAt(hour) {
  for (let i = 0; i < SKY_STOPS.length - 1; i++) {
    const a = SKY_STOPS[i], b = SKY_STOPS[i + 1];
    if (hour >= a.h && hour <= b.h) {
      const t = (hour - a.h) / (b.h - a.h || 1);
      return { sky: lerpRGB(a.sky, b.sky, t), build: lerpRGB(a.build, b.build, t) };
    }
  }
  return { sky: SKY_STOPS[0].sky, build: SKY_STOPS[0].build };
}

function updateSkyFx() {
  const hour = simTime / 3600;
  const { sky } = skyAt(hour);
  document.getElementById('skyFx').style.background =
    `linear-gradient(180deg, rgba(${sky[0]},${sky[1]},${sky[2]},0.55) 0%, rgba(${sky[0]},${sky[1]},${sky[2]},0.08) 55%, rgba(0,0,0,0.25) 100%)`;
}

];
const hudEls = () => ['topHud', 'statsHud', 'pulseWrap'].map((id) => document.getElementById(id));
function setHudVar(name, value) { for (const el of hudEls()) el.style.setProperty(name, value); }

let lastTod = '', lastTodLabel = '';
function updateTod() {
  const hour = (((simTime / 3600) % 24) + 24) % 24;
  let c = TOD_STOPS[0].c;
  for (let i = 0; i < TOD_STOPS.length - 1; i++) {
    const a = TOD_STOPS[i], b = TOD_STOPS[i + 1];
    if (hour >= a.h && hour <= b.h) { c = lerpRGB(a.c, b.c, (hour - a.h) / (b.h - a.h || 1)); break; }
  }
  const tod = c.join(',');
  if (tod !== lastTod) { setHudVar('--tod', tod); lastTod = tod; }
  const label = TOD_LABELS.find((l) => hour < l.until) || TOD_LABELS[TOD_LABELS.length - 1];
  if (label.en + label.ja !== lastTodLabel) {
    document.getElementById('todLabel').innerHTML = `<span class="en">${label.en}</span><span class="ja">${label.ja}</span>`;
    lastTodLabel = label.en + label.ja;
  }
}

/* ---------------------------------------------------------------- *
 * 鼓動の同期: 稼働便数に応じた心拍数(深夜はゆっくり、ラッシュは速く)で
 * タイトル・「現在稼働中」の点・再生位置を脈打たせる(ドクン・ドクッの2拍)
 * ---------------------------------------------------------------- */
const BPM_MIN = 42, BPM_MAX = 132;
const REDUCE_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let beatBpm = BPM_MIN, beatPhase = 0;
function updateHeartbeat(dtReal) {
  const target = BPM_MIN + (BPM_MAX - BPM_MIN) * currentActivityRatio();
  beatBpm += (target - beatBpm) * Math.min(1, dtReal * 1.5);
  beatPhase = (beatPhase + Math.min(dtReal, 0.25) * beatBpm / 60) % 1;
  const f = beatPhase;
  const p = REDUCE_MOTION ? 0 : Math.exp(-(((f - 0.05) / 0.045) ** 2)) + 0.55 * Math.exp(-(((f - 0.24) / 0.05) ** 2));
  setHudVar('--p', p.toFixed(3));
}

/* ---------------------------------------------------------------- *
 * ベースマップ(CARTO dark-matter)を作品の色に寄せる: 地名・道路を沈め、光の軌跡を主役にする
 * ---------------------------------------------------------------- */
function themeBasemap() {
  const style = map.getStyle();
  if (!style || !style.layers) return;
  const paint = (id, prop, v) => { try { map.setPaintProperty(id, prop, v); } catch (e) { /* 無いプロパティは無視 */ } };
  const layout = (id, prop, v) => { try { map.setLayoutProperty(id, prop, v); } catch (e) { /* 同上 */ } };
  for (const l of style.layers) {
    const id = l.id;
    if (l.type === 'background') paint(id, 'background-color', '#04060d');
    else if (l.type === 'fill') {
      if (id === 'water') paint(id, 'fill-color', '#08161f');
      else if (id.startsWith('building')) paint(id, 'fill-color', '#0b1020');
      else if (/^(landcover|landuse|park)/.test(id)) paint(id, 'fill-color', '#05070f');
    } else if (l.type === 'line') {
      if (id === 'waterway') paint(id, 'line-color', '#0e2a33');
      else if (id.startsWith('boundary')) paint(id, 'line-color', '#1a2238');
      else if (/_case/.test(id)) paint(id, 'line-color', '#04060d');
      else if (/rail/.test(id)) paint(id, 'line-color', '#0f1626');
      else if (/_(pri|trunk|mot)_fill/.test(id)) paint(id, 'line-color', '#1a2540');
      else if (/_sec_fill/.test(id)) paint(id, 'line-color', '#141d33');
      else if (/(_fill|_path)/.test(id)) paint(id, 'line-color', '#0e1426');
    } else if (l.type === 'symbol') {
      if (/^(roadname|poi|housenumber|place_hamlet|place_villages|watername_lake_line|waterway_label)/.test(id)) {
        layout(id, 'visibility', 'none');
      } else {
        paint(id, 'text-color', 'rgba(150,165,190,0.55)');
        paint(id, 'text-halo-color', 'rgba(3,4,10,0.85)');
        paint(id, 'icon-opacity', 0.35);
        layout(id, 'text-letter-spacing', 0.24);
      }
    }
  }
}

/* ---------------------------------------------------------------- *
 * 鼓動チャート(EKG風、5分刻みの稼働便数)
 * ---------------------------------------------------------------- */
function drawPulseChart() {
  const svg = document.getElementById('pulseSvg');
  const activity = pulseData.activity;
  if (!activity.length) return;
  const w = 1000, h = 100, pad = 6;
  const max = pulseData.max_activity || 1;
  const step = w / (activity.length - 1);
  const yOf = (v) => h - pad - (v / max) * (h - pad * 2);

  // 鉄道(下段)の線・エリア
  let railLine = `M0,${yOf(activity[0].rail)}`;
  // バス積み上げ(上段)の線・エリア(鉄道+バスの累積)
  let totalLine = `M0,${yOf(activity[0].rail + activity[0].bus)}`;
  for (let i = 1; i < activity.length; i++) {
    const x = i * step;
    railLine += ` L${x.toFixed(1)},${yOf(activity[i].rail).toFixed(1)}`;
    totalLine += ` L${x.toFixed(1)},${yOf(activity[i].rail + activity[i].bus).toFixed(1)}`;
  }
  const railArea = railLine + ` L${w},${h} L0,${h} Z`;
  // バスの帯 = 累積線をたどり、鉄道線を逆順にたどって戻る(鉄道の上に積み上げた領域)
  let busArea = totalLine;
  for (let i = activity.length - 1; i >= 0; i--) {
    const x = i * step;
    busArea += ` L${x.toFixed(1)},${yOf(activity[i].rail).toFixed(1)}`;
  }
  busArea += ' Z';

  svg.innerHTML = `
    <defs>
      <linearGradient id="pulseGradRail" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5eead4" stop-opacity="0.5"/>
        <stop offset="60%" stop-color="#5eead4" stop-opacity="0.16"/>
        <stop offset="100%" stop-color="#5eead4" stop-opacity="0.02"/>
      </linearGradient>
      <linearGradient id="pulseGradBus" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fb923c" stop-opacity="0.42"/>
        <stop offset="100%" stop-color="#fb923c" stop-opacity="0.08"/>
      </linearGradient>
      <filter id="pulseGlow" x="-5%" y="-50%" width="110%" height="200%">
        <feGaussianBlur stdDeviation="2 1.6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <path d="${railArea}" fill="url(#pulseGradRail)" />
    <path d="${busArea}" fill="url(#pulseGradBus)" />
    <g filter="url(#pulseGlow)">
      <path d="${railLine}" fill="none" stroke="#5eead4" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round" />
      <path d="${totalLine}" fill="none" stroke="#fb923c" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round" />
    </g>
  `;
}

let lastClockHour = null;
function updatePlayhead() {
  const frac = simTime / pulseData.duration_sec;
  document.getElementById('pulsePlayhead').style.left = (frac * 100) + '%';
  const clock = document.getElementById('clockDisplay');
  clock.textContent = fmtClock(simTime);
  // 毎正時に時計がふっと光る(分単位は約0.2秒ごとに変わるため、演出は時の変わり目だけ)
  const hourNow = Math.floor(simTime / 3600);
  if (hourNow !== lastClockHour) {
    if (lastClockHour !== null) { clock.classList.remove('chime'); void clock.offsetWidth; clock.classList.add('chime'); }
    lastClockHour = hourNow;
  }

  const bucketIdx = Math.min(pulseData.activity.length - 1, Math.floor(simTime / pulseData.bucket_sec));
  const bucket = pulseData.activity[bucketIdx];
  document.getElementById('railCount').textContent = bucket ? bucket.rail : 0;
  document.getElementById('busCount').textContent = bucket ? bucket.bus : 0;
}

/* ---------------------------------------------------------------- *
 * deck.gl レイヤー構築
 * ---------------------------------------------------------------- */
function currentActivityRatio() {
  const bucketIdx = Math.min(pulseData.activity.length - 1, Math.floor(simTime / pulseData.bucket_sec));
  const c = pulseData.activity[bucketIdx] ? pulseData.activity[bucketIdx].count : 0;
  return Math.min(1, c / (pulseData.max_activity || 1));
}

function currentVehicles(trips, t) {
  const out = [];
  for (const trip of trips) {
    const ts = trip.timestamps;
    if (!ts || ts.length < 2 || t < ts[0] || t > ts[ts.length - 1]) continue;
    let idx = 0;
    while (idx < ts.length - 2 && ts[idx + 1] < t) idx++;
    const t0 = ts[idx], t1 = ts[idx + 1];
    const p0 = trip.path[idx], p1 = trip.path[idx + 1];
    const frac = t1 > t0 ? (t - t0) / (t1 - t0) : 0;
    out.push({
      position: [p0[0] + (p1[0] - p0[0]) * frac, p0[1] + (p1[1] - p0[1]) * frac],
      mode: trip.mode,
    });
  }
  return out;
}

function buildLayers() {
  const layers = [];
  const hour = simTime / 3600;
  const { build: buildTint } = skyAt(hour);
  const activityRatio = currentActivityRatio();
  const vehicles = currentVehicles(pulseData.trips, simTime);
  updateBuildingGlow(vehicles);
  const glowNow = performance.now();

  if (buildings.length) {
    layers.push(new deck.PolygonLayer({
      id: 'buildings', data: buildings, extruded: true, wireframe: false,
      getPolygon: d => d.polygon, getElevation: d => d.height,
      getFillColor: (d, { index }) => {
        const t = Math.min(d.height / 60, 1);
        let r = Math.min(255, buildTint[0] + t * 34);
        let g = Math.min(255, buildTint[1] + t * 40);
        let b = Math.min(255, buildTint[2] + t * 55);
        const railHeat = decayedHeat(buildingHeatRail[index], buildingHeatAtRail[index], glowNow);
        const busHeat = decayedHeat(buildingHeatBus[index], buildingHeatAtBus[index], glowNow);
        const totalHeat = Math.min(1, railHeat + busHeat);
        if (totalHeat > 0.01) {
          const railShare = railHeat / (railHeat + busHeat);
          const k = totalHeat * GLOW_MAX_INTENSITY;
          const gr = GLOW_RAIL[0] * railShare + GLOW_BUS[0] * (1 - railShare);
          const gg = GLOW_RAIL[1] * railShare + GLOW_BUS[1] * (1 - railShare);
          const gb = GLOW_RAIL[2] * railShare + GLOW_BUS[2] * (1 - railShare);
          r += (gr - r) * k;
          g += (gg - g) * k;
          b += (gb - b) * k;
        }
        return [Math.round(r), Math.round(g), Math.round(b), 200];
      },
      getLineColor: [0, 0, 0, 60], lineWidthMinPixels: 1,
      updateTriggers: { getFillColor: colorTick },
      material: { ambient: 0.55, diffuse: 0.55, shininess: 28, specularColor: [70, 70, 90] },
    }));
  }

  // 稼働率に応じてトレイルの色・長さが変化する = 「鼓動」の視覚化
  const railColor = [Math.round(45 + activityRatio * 80), Math.round(212 - activityRatio * 20), Math.round(191 + activityRatio * 60)];
  const busColor = [Math.round(251), Math.round(146 - activityRatio * 40), Math.round(60 + activityRatio * 120)];
  const trailLength = 260 - activityRatio * 120;

  layers.push(new deck.TripsLayer({
    id: 'trips', data: pulseData.trips, getPath: d => d.path, getTimestamps: d => d.timestamps,
    getColor: d => d.mode === 'rail' ? railColor : busColor,
    opacity: 0.92, widthMinPixels: 2.4, capRounded: true, jointRounded: true,
    trailLength, currentTime: simTime,
    parameters: { depthTest: false },
  }));

  if (vehicles.length) {
    layers.push(new deck.ScatterplotLayer({
      id: 'vehicle-positions', data: vehicles, getPosition: d => d.position,
      getFillColor: d => d.mode === 'rail' ? [...railColor, 255] : [...busColor, 255],
      getRadius: 5.5, radiusMinPixels: 3, radiusMaxPixels: 7,
      parameters: { depthTest: false },
    }));
  }

  return layers;
}

function render() {
  if (!deckOverlay) return;
  deckOverlay.setProps({ layers: buildLayers() });
  updateSkyFx();
  updateTod();
  updatePlayhead();
}

function tick(ts) {
  if (lastFrameTs === null) lastFrameTs = ts;
  const dtReal = (ts - lastFrameTs) / 1000;
  lastFrameTs = ts;

  simTime = skipDeadZones(simTime + dtReal * SIM_SPEED);
  if (ts - lastColorTickAt > COLOR_TICK_INTERVAL_MS) {
    lastColorTickAt = ts;
    colorTick++;
  }
  render();
  updateHeartbeat(dtReal);

  if (Date.now() - lastUserActionTs > IDLE_BEFORE_AUTOROTATE_MS) {
    map.setBearing((map.getBearing() + dtReal * AUTO_ROTATE_DEG_PER_SEC) % 360);
  }

  requestAnimationFrame(tick);
}

/* ---------------------------------------------------------------- *
 * 鼓動チャートのクリック/ドラッグで時間帯を移動
 * ---------------------------------------------------------------- */
function setupPulseScrub() {
  const chart = document.getElementById('pulseChart');
  let dragging = false;
  const scrub = (clientX) => {
    const rect = chart.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    simTime = skipDeadZones(frac * pulseData.duration_sec);
    lastUserActionTs = Date.now();
    render();
  };
  chart.addEventListener('pointerdown', (e) => { dragging = true; scrub(e.clientX); });
  window.addEventListener('pointermove', (e) => { if (dragging) scrub(e.clientX); });
  window.addEventListener('pointerup', () => { dragging = false; });
}

let cityFitLocked = false;   // ユーザーが視点を動かしたら、画面サイズ変更時の範囲合わせをやめる
function markUserAction() { lastUserActionTs = Date.now(); cityFitLocked = true; }

/* ---------------------------------------------------------------- *
 * 初期化
 * ---------------------------------------------------------------- */
let currentCity = { id: 'tokyo', name: '東京', weather: true };

// 東京サンプルのJR東日本は、ライセンス上リポジトリに置けないため、表示時にサーバーがトークンで取得した加工済み運行を重ねる。
// 都営のデータを先に表示し、JRが取得できた時点で追加する(サーバーが起動直後で準備中なら、しばらく待って再試行)。
const TOKYO_JR_WINDOW = [139.65, 35.60, 139.88, 35.80];

function mergeRailTripsIntoPulse(extra) {
  const act = pulseData.activity, nB = act.length, bs = pulseData.bucket_sec;
  for (const t of extra) {
    const b0 = Math.floor(t.timestamps[0] / bs);
    if (b0 >= nB) continue;
    const b1 = Math.min(nB - 1, Math.floor(t.timestamps[t.timestamps.length - 1] / bs));
    for (let b = Math.max(0, b0); b <= b1; b++) act[b].rail++;
  }
  let max = 1;
  for (const a of act) { a.count = a.rail + a.bus; if (a.count > max) max = a.count; }
  pulseData.max_activity = max;
  pulseData.trips = pulseData.trips.concat(extra);
  drawPulseChart();
}

async function addTokyoJr() {
  const [w, s, e, n] = TOKYO_JR_WINDOW;
  for (let attempt = 0; attempt < 6; attempt++) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 150000);
      const res = await fetch(`/api/jr-east?w=${w}&s=${s}&e=${e}&n=${n}&prefs=all`, { signal: ctrl.signal });
      clearTimeout(timer);
      const j = res.ok ? await res.json() : null;
      if (j && j.available) { mergeRailTripsIntoPulse(j.trips); return; }
      if (j && /未設定/.test(j.reason || '')) return;   // このサーバーにはトークンが無い: JRなしで表示する
    } catch (err) { /* 再試行 */ }
    await new Promise((r) => setTimeout(r, 20000));
  }
}

async function init() {
  const cityId = new URLSearchParams(location.search).get('city');
  if (!cityId) { Home.start(); return; }

  let camera;
  if (cityId === 'tokyo') {
    camera = { center: [139.750, 35.686], zoom: window.innerWidth < 640 ? 11.6 : 12.6 };
  } else {
    let cityMeta = null;
    try { cityMeta = await CityStore.getMeta(cityId); } catch (e) { console.error(e); }
    if (!cityMeta) { location.replace('./'); return; }
    currentCity = { id: cityId, name: cityMeta.name, weather: false };
    document.getElementById('cityLabel').textContent = cityMeta.name;
    document.title = `${cityMeta.name} | 都市の鼓動`;
    const small = window.innerWidth < 640;
    camera = {
      bounds: cityMeta.viewBounds,
      fitBoundsOptions: { padding: small ? { top: 110, bottom: 150, left: 16, right: 16 } : { top: 90, bottom: 150, left: 40, right: 40 }, maxZoom: 14 },
    };
  }

  map = new maplibregl.Map({
    container: 'map', style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    ...camera, pitch: 38, bearing: 0, antialias: true, attributionControl: true,
  });

  map.once('load', themeBasemap);

  // 画面の大きさが確定する前(非表示タブなど)に範囲合わせが行われるとズレるため、大きさが分かった時点で合わせ直す
  if (camera.bounds) {
    const fit = () => {
      const el = map.getContainer();
      if (cityFitLocked || el.clientWidth < 100 || el.clientHeight < 300) return;
      map.fitBounds(camera.bounds, { ...camera.fitBoundsOptions, duration: 0 });
    };
    map.once('load', fit);
    map.on('resize', fit);
  }

  ['dragstart', 'zoomstart', 'rotatestart', 'pitchstart'].forEach(evt => {
    map.on(evt, (e) => { if (e.originalEvent) markUserAction(); });
  });

  deckOverlay = new deck.MapboxOverlay({ interleaved: true, layers: [] });
  map.addControl(deckOverlay);
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

  setupPulseScrub();

  async function loadData() {
    if (cityId === 'tokyo') {
      const [bRes, pRes] = await Promise.all([
        fetch('/data/buildings_3d.json'),
        fetch('/data/transit_pulse.json'),
      ]);
      if (!bRes.ok || !pRes.ok) throw new Error(`HTTP ${bRes.status}/${pRes.status}`);
      buildings = await bRes.json();
      pulseData = await pRes.json();
    } else {
      const d = await CityStore.getData(cityId);
      if (!d) throw new Error('保存データが見つかりません');
      buildings = d.buildings;
      pulseData = d.pulseData;
    }
    buildBuildingIndex();
    computeDeadZones();
  }

  let loaded = false, lastError = null;
  for (const delayMs of [0, 1000, 3000]) {
    if (delayMs) await new Promise(r => setTimeout(r, delayMs));
    try {
      await loadData();
      loaded = true;
      break;
    } catch (e) {
      lastError = e;
      console.error('data load failed', e);
    }
  }
  if (!loaded) {
    document.querySelector('#loading .lg').textContent =
      `データの読み込みに失敗しました(${lastError && lastError.message ? lastError.message : lastError})。再読み込みしてください`;
    return;
  }

  drawPulseChart();
  if (currentCity.weather) {
    await loadWeather();
    setInterval(loadWeather, 5 * 60 * 1000);
  }

  // 現在時刻に合わせて開始(0時始まりより、今の時間帯から始まる方が「今の都市」らしい)
  const now = new Date();
  simTime = skipDeadZones(now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds());

  document.getElementById('loading').classList.add('hidden');
  render();
  requestAnimationFrame(tick);
  if (cityId === 'tokyo') addTokyoJr();
}

map = null;
window.addEventListener('load', init);
</script>
</body>
</html>
