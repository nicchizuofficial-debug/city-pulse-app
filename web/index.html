<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; width:100%; background:#03040a; overflow:hidden;
    font-family:'Inter','Noto Sans JP',-apple-system,sans-serif; }

  #skyFx { position:absolute; inset:0; z-index:2; pointer-events:none; mix-blend-mode:soft-light; transition: background 1.2s ease; }

  #loading .sp { width:34px; height:34px; border-radius:50%; border:2.5px solid #1e293b; border-top-color:#5eead4; animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #topHud { position:absolute; top:22px; left:26px; right:26px; z-index:6; display:flex;

  #titleBlock .s { font-size:0.72rem; color:#94a3b8; margin-top:2px; letter-spacing:0.08em; }

  #titleBlock .c { color:#cbd5e1; font-weight:700; letter-spacing:0.04em; }
  #titleBlock .c:empty { display:none; }

  #clockDisplay { font-family:'Inter',monospace; font-size:2.6rem; font-weight:800; letter-spacing:0.03em; line-height:1; }
  #statLine { font-size:0.74rem; color:#cbd5e1; margin-top:4px; letter-spacing:0.04em; }

  #statLine .bus-label { color:#fb923c; }

  #pulseWrap { position:absolute; left:0; right:0; bottom:0; z-index:6; padding:10px 22px 16px; pointer-events:auto; }
  #pulseLabels { display:flex; justify-content:space-between; font-size:0.62rem; color:#64748b; margin-bottom:2px; padding:0 2px; }
  #pulseChart { position:relative; height:78px; border-radius:12px; background:rgba(3,6,16,0.5); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.06); cursor:pointer; overflow:hidden; }
  #pulseSvg { width:100%; height:100%; display:block; }
  #pulsePlayhead { position:absolute; top:0; bottom:0; width:2px; background:#f8fafc; box-shadow:0 0 10px 2px rgba(248,250,252,0.7);

  #pulseHint { text-align:center; font-size:0.62rem; color:#475569; margin-top:6px; letter-spacing:0.03em; }

  @media (hover: none) {

  }

  /* スマホ・狭い画面: タイトル・時計・稼働数が重ならないよう縦に積む */
  @media (max-width: 640px) {

    .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { bottom:calc(122px + env(safe-area-inset-bottom)); }
  }

  ::selection { background: rgba(94,234,212,0.35); }

<body>
<script>document.body.classList.add(new URLSearchParams(location.search).get('city') ? 'viewer' : 'home');</script>
<div id="home"></div>
<div id="map">
  <div id="skyFx"></div>
  <div id="weatherFx"></div>
  <div id="vignette"></div>

  <div id="topHud">
    <div id="titleBlock">
      <div class="t">都市の鼓動</div>
      <div class="s">CITY PULSE</div>
      <div class="sub2"><span class="c" id="cityLabel"></span><a class="h" href="./">‹ ホーム</a></div>
    </div>

  <div id="statsHud">
    <div id="clockDisplay">00:00</div>
    <div id="statLine">現在稼働中 ・ <span class="rail-label">鉄道 <b id="railCount">--</b> 台</span> ・ <span class="bus-label">バス <b id="busCount">--</b> 台</span></div>
  </div>

  <div id="pulseWrap">
    <div id="pulseLabels"><span>0時</span><span>6時</span><span>12時</span><span>18時</span><span>24時</span></div>
    <div id="pulseChart">
      <svg id="pulseSvg" viewBox="0 0 1000 100" preserveAspectRatio="none"></svg>
      <div id="pulsePlayhead"></div>
    </div>
    <div id="pulseHint">
      <span class="hint-pc">クリック/ドラッグで時間帯を移動 ・ マウスドラッグで視点回転 ・ 何もしなければ自動再生</span>
      <span class="hint-touch">グラフをなぞって時間帯を移動 ・ 2本指で視点回転 ・ 放置で自動再生</span>
    </div>
  </div>

  <div id="loading"><div class="sp"></div><div class="lg">都市の鼓動を読み込み中…</div></div>
</div>

<script>
/* ============================================================== *
 * 都市の鼓動 (City Pulse) — 24時間ビジュアライザー
 * 特定のタスクを持たない鑑賞用アート作品。実際のGTFS時刻表・建物形状・
 * 気象データをもとに、街の一日の呼吸(通勤ラッシュ=鼓動が高まる、深夜=
 * 静まる)を光の軌跡として可視化する。
 * ============================================================== */

const CENTER = [139.7622, 35.6866];
const LOOP_SEC = 300;                 // 24時間を実時間5分でループ再生
const SIM_SPEED = 86400 / LOOP_SEC;   // 1秒あたりの進行(シミュレーション秒)
const AUTO_ROTATE_DEG_PER_SEC = 1.0;
const IDLE_BEFORE_AUTOROTATE_MS = 3500;

let map, deckOverlay;
let buildings = [];
let pulseData = { duration_sec: 86400, bucket_sec: 300, max_activity: 1, activity: [], trips: [] };
let simTime = 0;
let deadZones = []; // 鉄道・バスとも稼働0台の時間帯([開始秒, 終了秒) のリスト)。自動再生ではスキップする。
let lastFrameTs = null;
let lastUserActionTs = 0;
let weather = { precipitation: { intensity: 0, risk_level: 'low' }, wbgt: { intensity: 0, risk_level: 'low' } };

/* ---------------------------------------------------------------- *
 * 建物と車両の近接判定(鉄道・バスが通り過ぎた建物が光る演出)用インデックス
 * ---------------------------------------------------------------- */
const GRID_CELL_DEG = 0.002;       // 空間インデックスのマス目(約220m四方)
const TOUCH_MARGIN_DEG = 0.0018;   // 建物の輪郭からこの距離内なら周辺として光る対象(約200m)
const HEAT_HALFLIFE_MS = 2500;     // 蓄積した「熱」が半減するまでの時間(実時間ミリ秒)
const HEAT_ADD_PER_SEC = 3.2;      // 車両が触れている間、1秒あたり蓄積する熱量
const GLOW_MAX_INTENSITY = 0.85;   // 熱が最大(=拠点)のときの光の強さ
const GLOW_RAIL = [190, 255, 235];
const GLOW_BUS = [255, 205, 140];
let buildingCx = new Float64Array(0);
let buildingCy = new Float64Array(0);
let buildingRadius = new Float32Array(0);
let buildingHeatRail = new Float32Array(0);
let buildingHeatBus = new Float32Array(0);
let buildingHeatAtRail = new Float32Array(0);
let buildingHeatAtBus = new Float32Array(0);
let buildingGrid = new Map();
let lastGlowFrameAt = 0;

function decayedHeat(heat, at, now) {
  if (!at) return 0;
  const dt = now - at;
  if (dt <= 0) return heat;
  return heat * Math.pow(0.5, dt / HEAT_HALFLIFE_MS);
}
// deck.glはgetFillColorに新しい関数を渡すだけでは属性を再計算しないため、
// updateTriggersで明示的に「今フレーム再計算が必要」と伝える。
// 57,198棟すべてを毎フレーム再計算すると重いので、一定間隔に間引く。
let colorTick = 0;
let lastColorTickAt = 0;
const COLOR_TICK_INTERVAL_MS = 120;

function buildBuildingIndex() {
  const n = buildings.length;
  buildingCx = new Float64Array(n);
  buildingCy = new Float64Array(n);
  buildingRadius = new Float32Array(n);
  buildingHeatRail = new Float32Array(n);
  buildingHeatBus = new Float32Array(n);
  buildingHeatAtRail = new Float32Array(n);
  buildingHeatAtBus = new Float32Array(n);
  buildingGrid = new Map();

  for (let i = 0; i < n; i++) {
    const poly = buildings[i].polygon;
    let sx = 0, sy = 0;
    for (const [lon, lat] of poly) { sx += lon; sy += lat; }
    const cx = sx / poly.length, cy = sy / poly.length;
    let maxR = 0;
    for (const [lon, lat] of poly) {
      const d = Math.hypot(lon - cx, lat - cy);
      if (d > maxR) maxR = d;
    }
    buildingCx[i] = cx; buildingCy[i] = cy; buildingRadius[i] = maxR;
    const key = Math.floor(cx / GRID_CELL_DEG) + '_' + Math.floor(cy / GRID_CELL_DEG);
    let bucket = buildingGrid.get(key);
    if (!bucket) { bucket = []; buildingGrid.set(key, bucket); }
    bucket.push(i);
  }
}

function updateBuildingGlow(vehicles) {
  if (!buildings.length) return;
  const now = performance.now();
  // 経過時間に応じた熱量加算にすることで、フレームレートに依存せず
  // 「同時に多くの便が触れている拠点ほど熱が積み上がって明るくなる」を再現する。
  const dtSec = Math.min(now - (lastGlowFrameAt || now), 200) / 1000;
  lastGlowFrameAt = now;

  for (const v of vehicles) {
    const [lon, lat] = v.position;
    const isRail = v.mode === 'rail';
    const heatArr = isRail ? buildingHeatRail : buildingHeatBus;
    const atArr = isRail ? buildingHeatAtRail : buildingHeatAtBus;
    const gx = Math.floor(lon / GRID_CELL_DEG), gy = Math.floor(lat / GRID_CELL_DEG);
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const bucket = buildingGrid.get((gx + dx) + '_' + (gy + dy));
        if (!bucket) continue;
        for (const i of bucket) {
          const dist = Math.hypot(lon - buildingCx[i], lat - buildingCy[i]);
          const reach = buildingRadius[i] + TOUCH_MARGIN_DEG;
          if (dist < reach) {
            // 直接触れているほど濃く、周辺(輪郭から離れるほど)淡く寄与する
            const prox = 1 - Math.max(0, dist - buildingRadius[i]) / TOUCH_MARGIN_DEG;
            const cur = decayedHeat(heatArr[i], atArr[i], now);
            heatArr[i] = Math.min(1, cur + prox * HEAT_ADD_PER_SEC * dtSec);
            atArr[i] = now;
          }
        }
      }
    }
  }
}

function computeDeadZones() {
  deadZones = [];
  const activity = pulseData.activity;
  const bucketSec = pulseData.bucket_sec;
  let start = null;
  for (const b of activity) {
    const isDead = (b.rail || 0) + (b.bus || 0) === 0;
    if (isDead && start === null) start = b.t;
    if (!isDead && start !== null) { deadZones.push([start, b.t]); start = null; }
  }
  if (start !== null) deadZones.push([start, pulseData.duration_sec]);
}

// 0台の時間帯に入っていたら、その終わりまで進める(自動再生・初期表示・チャート操作の全経路で共通)
function skipDeadZones(t) {
  t = ((t % pulseData.duration_sec) + pulseData.duration_sec) % pulseData.duration_sec;
  for (const [s, e] of deadZones) {
    if (t >= s && t < e) return e % pulseData.duration_sec;
  }
  return t;
}

function fmtClock(totalSec) {
  totalSec = ((totalSec % 86400) + 86400) % 86400;
  const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
  const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
  return `${h}:${m}`;
}

/* ---------------------------------------------------------------- *
 * 時刻に応じた空・霧・建物トーンのグラデーション(黎明・昼・夕暮れ・夜)
 * ---------------------------------------------------------------- */
const SKY_STOPS = [
  { h: 0,    sky: [4, 6, 16],    build: [16, 20, 34] },
  { h: 4.5,  sky: [6, 9, 26],    build: [18, 22, 40] },
  { h: 5.8,  sky: [255, 140, 92], build: [70, 46, 44] },
  { h: 7.5,  sky: [150, 205, 255], build: [58, 68, 92] },
  { h: 12,   sky: [110, 185, 255], build: [55, 66, 92] },
  { h: 16.5, sky: [255, 170, 110], build: [78, 58, 48] },
  { h: 18.5, sky: [255, 120, 90],  build: [70, 42, 52] },
  { h: 20,   sky: [40, 28, 62],   build: [34, 26, 50] },
  { h: 22,   sky: [10, 11, 28],   build: [20, 22, 38] },
  { h: 24,   sky: [4, 6, 16],    build: [16, 20, 34] },
];

function lerp(a, b, t) { return a + (b - a) * t; }
function lerpRGB(a, b, t) { return [Math.round(lerp(a[0],b[0],t)), Math.round(lerp(a[1],b[1],t)), Math.round(lerp(a[2],b[2],t))]; }

function skyAt(hour) {
  for (let i = 0; i < SKY_STOPS.length - 1; i++) {
    const a = SKY_STOPS[i], b = SKY_STOPS[i + 1];
    if (hour >= a.h && hour <= b.h) {
      const t = (hour - a.h) / (b.h - a.h || 1);
      return { sky: lerpRGB(a.sky, b.sky, t), build: lerpRGB(a.build, b.build, t) };
    }
  }
  return { sky: SKY_STOPS[0].sky, build: SKY_STOPS[0].build };
}

function updateSkyFx() {
  const hour = simTime / 3600;
  const { sky } = skyAt(hour);
  document.getElementById('skyFx').style.background =
    `linear-gradient(180deg, rgba(${sky[0]},${sky[1]},${sky[2]},0.55) 0%, rgba(${sky[0]},${sky[1]},${sky[2]},0.08) 55%, rgba(0,0,0,0.25) 100%)`;
}

/* ---------------------------------------------------------------- *
 * 天気の熱波エフェクト(モグルートと同じ表現手法)
 * ---------------------------------------------------------------- */
function updateWeatherFx() {
  const el = document.getElementById('weatherFx');
  const wbgt = weather.wbgt.risk_level;
  const rank = { low: 0, moderate: 1, high: 2, extreme: 3 };
  el.className = rank[wbgt] >= 1 ? 'heat' : '';
}

async function loadWeather() {
  try {
    const r = await fetch('/api/weather');
    weather = await r.json();
  } catch (e) { console.error('weather fetch failed', e); }
  updateWeatherFx();
}

/* ---------------------------------------------------------------- *
 * 鼓動チャート(EKG風、5分刻みの稼働便数)
 * ---------------------------------------------------------------- */
function drawPulseChart() {
  const svg = document.getElementById('pulseSvg');
  const activity = pulseData.activity;
  if (!activity.length) return;
  const w = 1000, h = 100, pad = 6;
  const max = pulseData.max_activity || 1;
  const step = w / (activity.length - 1);
  const yOf = (v) => h - pad - (v / max) * (h - pad * 2);

  // 鉄道(下段)の線・エリア
  let railLine = `M0,${yOf(activity[0].rail)}`;
  // バス積み上げ(上段)の線・エリア(鉄道+バスの累積)
  let totalLine = `M0,${yOf(activity[0].rail + activity[0].bus)}`;
  for (let i = 1; i < activity.length; i++) {
    const x = i * step;
    railLine += ` L${x.toFixed(1)},${yOf(activity[i].rail).toFixed(1)}`;
    totalLine += ` L${x.toFixed(1)},${yOf(activity[i].rail + activity[i].bus).toFixed(1)}`;
  }
  const railArea = railLine + ` L${w},${h} L0,${h} Z`;
  // バスの帯 = 累積線をたどり、鉄道線を逆順にたどって戻る(鉄道の上に積み上げた領域)
  let busArea = totalLine;
  for (let i = activity.length - 1; i >= 0; i--) {
    const x = i * step;
    busArea += ` L${x.toFixed(1)},${yOf(activity[i].rail).toFixed(1)}`;
  }
  busArea += ' Z';

  svg.innerHTML = `
    <defs>
      <linearGradient id="pulseGradRail" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5eead4" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#5eead4" stop-opacity="0.05"/>
      </linearGradient>
      <linearGradient id="pulseGradBus" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fb923c" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#fb923c" stop-opacity="0.15"/>
      </linearGradient>
    </defs>
    <path d="${railArea}" fill="url(#pulseGradRail)" />
    <path d="${busArea}" fill="url(#pulseGradBus)" />
    <path d="${railLine}" fill="none" stroke="#5eead4" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" />
    <path d="${totalLine}" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" />
  `;
}

function updatePlayhead() {
  const frac = simTime / pulseData.duration_sec;
  document.getElementById('pulsePlayhead').style.left = (frac * 100) + '%';
  document.getElementById('clockDisplay').textContent = fmtClock(simTime);

  const bucketIdx = Math.min(pulseData.activity.length - 1, Math.floor(simTime / pulseData.bucket_sec));
  const bucket = pulseData.activity[bucketIdx];
  document.getElementById('railCount').textContent = bucket ? bucket.rail : 0;
  document.getElementById('busCount').textContent = bucket ? bucket.bus : 0;
}

/* ---------------------------------------------------------------- *
 * deck.gl レイヤー構築
 * ---------------------------------------------------------------- */
function currentActivityRatio() {
  const bucketIdx = Math.min(pulseData.activity.length - 1, Math.floor(simTime / pulseData.bucket_sec));
  const c = pulseData.activity[bucketIdx] ? pulseData.activity[bucketIdx].count : 0;
  return Math.min(1, c / (pulseData.max_activity || 1));
}

function currentVehicles(trips, t) {
  const out = [];
  for (const trip of trips) {
    const ts = trip.timestamps;
    if (!ts || ts.length < 2 || t < ts[0] || t > ts[ts.length - 1]) continue;
    let idx = 0;
    while (idx < ts.length - 2 && ts[idx + 1] < t) idx++;
    const t0 = ts[idx], t1 = ts[idx + 1];
    const p0 = trip.path[idx], p1 = trip.path[idx + 1];
    const frac = t1 > t0 ? (t - t0) / (t1 - t0) : 0;
    out.push({
      position: [p0[0] + (p1[0] - p0[0]) * frac, p0[1] + (p1[1] - p0[1]) * frac],
      mode: trip.mode,
    });
  }
  return out;
}

function buildLayers() {
  const layers = [];
  const hour = simTime / 3600;
  const { build: buildTint } = skyAt(hour);
  const activityRatio = currentActivityRatio();
  const vehicles = currentVehicles(pulseData.trips, simTime);
  updateBuildingGlow(vehicles);
  const glowNow = performance.now();

  if (buildings.length) {
    layers.push(new deck.PolygonLayer({
      id: 'buildings', data: buildings, extruded: true, wireframe: false,
      getPolygon: d => d.polygon, getElevation: d => d.height,
      getFillColor: (d, { index }) => {
        const t = Math.min(d.height / 60, 1);
        let r = Math.min(255, buildTint[0] + t * 34);
        let g = Math.min(255, buildTint[1] + t * 40);
        let b = Math.min(255, buildTint[2] + t * 55);
        const railHeat = decayedHeat(buildingHeatRail[index], buildingHeatAtRail[index], glowNow);
        const busHeat = decayedHeat(buildingHeatBus[index], buildingHeatAtBus[index], glowNow);
        const totalHeat = Math.min(1, railHeat + busHeat);
        if (totalHeat > 0.01) {
          const railShare = railHeat / (railHeat + busHeat);
          const k = totalHeat * GLOW_MAX_INTENSITY;
          const gr = GLOW_RAIL[0] * railShare + GLOW_BUS[0] * (1 - railShare);
          const gg = GLOW_RAIL[1] * railShare + GLOW_BUS[1] * (1 - railShare);
          const gb = GLOW_RAIL[2] * railShare + GLOW_BUS[2] * (1 - railShare);
          r += (gr - r) * k;
          g += (gg - g) * k;
          b += (gb - b) * k;
        }
        return [Math.round(r), Math.round(g), Math.round(b), 200];
      },
      getLineColor: [0, 0, 0, 60], lineWidthMinPixels: 1,
      updateTriggers: { getFillColor: colorTick },
      material: { ambient: 0.55, diffuse: 0.55, shininess: 28, specularColor: [70, 70, 90] },
    }));
  }

  // 稼働率に応じてトレイルの色・長さが変化する = 「鼓動」の視覚化
  const railColor = [Math.round(45 + activityRatio * 80), Math.round(212 - activityRatio * 20), Math.round(191 + activityRatio * 60)];
  const busColor = [Math.round(251), Math.round(146 - activityRatio * 40), Math.round(60 + activityRatio * 120)];
  const trailLength = 260 - activityRatio * 120;

  layers.push(new deck.TripsLayer({
    id: 'trips', data: pulseData.trips, getPath: d => d.path, getTimestamps: d => d.timestamps,
    getColor: d => d.mode === 'rail' ? railColor : busColor,
    opacity: 0.92, widthMinPixels: 2.4, capRounded: true, jointRounded: true,
    trailLength, currentTime: simTime,
    parameters: { depthTest: false },
  }));

  if (vehicles.length) {
    layers.push(new deck.ScatterplotLayer({
      id: 'vehicle-positions', data: vehicles, getPosition: d => d.position,
      getFillColor: d => d.mode === 'rail' ? [...railColor, 255] : [...busColor, 255],
      getRadius: 5.5, radiusMinPixels: 3, radiusMaxPixels: 7,
      parameters: { depthTest: false },
    }));
  }

  return layers;
}

function render() {
  if (!deckOverlay) return;
  deckOverlay.setProps({ layers: buildLayers() });
  updateSkyFx();
  updatePlayhead();
}

function tick(ts) {
  if (lastFrameTs === null) lastFrameTs = ts;
  const dtReal = (ts - lastFrameTs) / 1000;
  lastFrameTs = ts;

  simTime = skipDeadZones(simTime + dtReal * SIM_SPEED);
  if (ts - lastColorTickAt > COLOR_TICK_INTERVAL_MS) {
    lastColorTickAt = ts;
    colorTick++;
  }
  render();

  if (Date.now() - lastUserActionTs > IDLE_BEFORE_AUTOROTATE_MS) {
    map.setBearing((map.getBearing() + dtReal * AUTO_ROTATE_DEG_PER_SEC) % 360);
  }

  requestAnimationFrame(tick);
}

/* ---------------------------------------------------------------- *
 * 鼓動チャートのクリック/ドラッグで時間帯を移動
 * ---------------------------------------------------------------- */
function setupPulseScrub() {
  const chart = document.getElementById('pulseChart');
  let dragging = false;
  const scrub = (clientX) => {
    const rect = chart.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    simTime = skipDeadZones(frac * pulseData.duration_sec);
    lastUserActionTs = Date.now();
    render();
  };
  chart.addEventListener('pointerdown', (e) => { dragging = true; scrub(e.clientX); });
  window.addEventListener('pointermove', (e) => { if (dragging) scrub(e.clientX); });
  window.addEventListener('pointerup', () => { dragging = false; });
}

let cityFitLocked = false;   // ユーザーが視点を動かしたら、画面サイズ変更時の範囲合わせをやめる
function markUserAction() { lastUserActionTs = Date.now(); cityFitLocked = true; }

/* ---------------------------------------------------------------- *
 * 初期化
 * ---------------------------------------------------------------- */
let currentCity = { id: 'tokyo', name: '東京', weather: true };

// 東京サンプルのJR東日本は、ライセンス上リポジトリに置けないため、表示時にサーバーがトークンで取得した加工済み運行を重ねる。
// 都営のデータを先に表示し、JRが取得できた時点で追加する(サーバーが起動直後で準備中なら、しばらく待って再試行)。
const TOKYO_JR_WINDOW = [139.65, 35.60, 139.88, 35.80];

function mergeRailTripsIntoPulse(extra) {
  const act = pulseData.activity, nB = act.length, bs = pulseData.bucket_sec;
  for (const t of extra) {
    const b0 = Math.floor(t.timestamps[0] / bs);
    if (b0 >= nB) continue;
    const b1 = Math.min(nB - 1, Math.floor(t.timestamps[t.timestamps.length - 1] / bs));
    for (let b = Math.max(0, b0); b <= b1; b++) act[b].rail++;
  }
  let max = 1;
  for (const a of act) { a.count = a.rail + a.bus; if (a.count > max) max = a.count; }
  pulseData.max_activity = max;
  pulseData.trips = pulseData.trips.concat(extra);
  drawPulseChart();
}

async function addTokyoJr() {
  const [w, s, e, n] = TOKYO_JR_WINDOW;
  for (let attempt = 0; attempt < 6; attempt++) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 150000);
      const res = await fetch(`/api/jr-east?w=${w}&s=${s}&e=${e}&n=${n}&prefs=all`, { signal: ctrl.signal });
      clearTimeout(timer);
      const j = res.ok ? await res.json() : null;
      if (j && j.available) { mergeRailTripsIntoPulse(j.trips); return; }
      if (j && /未設定/.test(j.reason || '')) return;   // このサーバーにはトークンが無い: JRなしで表示する
    } catch (err) { /* 再試行 */ }
    await new Promise((r) => setTimeout(r, 20000));
  }
}

async function init() {
  const cityId = new URLSearchParams(location.search).get('city');
  if (!cityId) { Home.start(); return; }

  let camera;
  if (cityId === 'tokyo') {
    camera = { center: [139.750, 35.686], zoom: window.innerWidth < 640 ? 11.6 : 12.6 };
  } else {
    let cityMeta = null;
    try { cityMeta = await CityStore.getMeta(cityId); } catch (e) { console.error(e); }
    if (!cityMeta) { location.replace('./'); return; }
    currentCity = { id: cityId, name: cityMeta.name, weather: false };
    document.getElementById('cityLabel').textContent = cityMeta.name;
    document.title = `${cityMeta.name} | 都市の鼓動`;
    const small = window.innerWidth < 640;
    camera = {
      bounds: cityMeta.viewBounds,
      fitBoundsOptions: { padding: small ? { top: 110, bottom: 150, left: 16, right: 16 } : { top: 90, bottom: 150, left: 40, right: 40 }, maxZoom: 14 },
    };
  }

  map = new maplibregl.Map({
    container: 'map', style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    ...camera, pitch: 38, bearing: 0, antialias: true, attributionControl: true,
  });

  // 画面の大きさが確定する前(非表示タブなど)に範囲合わせが行われるとズレるため、大きさが分かった時点で合わせ直す
  if (camera.bounds) {
    const fit = () => {
      const el = map.getContainer();
      if (cityFitLocked || el.clientWidth < 100 || el.clientHeight < 300) return;
      map.fitBounds(camera.bounds, { ...camera.fitBoundsOptions, duration: 0 });
    };
    map.once('load', fit);
    map.on('resize', fit);
  }

  ['dragstart', 'zoomstart', 'rotatestart', 'pitchstart'].forEach(evt => {
    map.on(evt, (e) => { if (e.originalEvent) markUserAction(); });
  });

  deckOverlay = new deck.MapboxOverlay({ interleaved: true, layers: [] });
  map.addControl(deckOverlay);
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

  setupPulseScrub();

  async function loadData() {
    if (cityId === 'tokyo') {
      const [bRes, pRes] = await Promise.all([
        fetch('/data/buildings_3d.json'),
        fetch('/data/transit_pulse.json'),
      ]);
      if (!bRes.ok || !pRes.ok) throw new Error(`HTTP ${bRes.status}/${pRes.status}`);
      buildings = await bRes.json();
      pulseData = await pRes.json();
    } else {
      const d = await CityStore.getData(cityId);
      if (!d) throw new Error('保存データが見つかりません');
      buildings = d.buildings;
      pulseData = d.pulseData;
    }
    buildBuildingIndex();
    computeDeadZones();
  }

  let loaded = false, lastError = null;
  for (const delayMs of [0, 1000, 3000]) {
    if (delayMs) await new Promise(r => setTimeout(r, delayMs));
    try {
      await loadData();
      loaded = true;
      break;
    } catch (e) {
      lastError = e;
      console.error('data load failed', e);
    }
  }
  if (!loaded) {
    document.querySelector('#loading .lg').textContent =
      `データの読み込みに失敗しました(${lastError && lastError.message ? lastError.message : lastError})。再読み込みしてください`;
    return;
  }

  drawPulseChart();
  if (currentCity.weather) {
    await loadWeather();
    setInterval(loadWeather, 5 * 60 * 1000);
  }

  // 現在時刻に合わせて開始(0時始まりより、今の時間帯から始まる方が「今の都市」らしい)
  const now = new Date();
  simTime = skipDeadZones(now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds());

  document.getElementById('loading').classList.add('hidden');
  render();
  requestAnimationFrame(tick);
  if (cityId === 'tokyo') addTokyoJr();
}

map = null;
window.addEventListener('load', init);
</script>
</body>
</html>
